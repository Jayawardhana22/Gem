services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      SA_PASSWORD: "Your_password123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P $${SA_PASSWORD} -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      retries: 10

  backend-api:
    build:
      context: ./backend/GemMarketplace.API
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Cors__AllowedOrigin=http://localhost:3000
      - ConnectionStrings__DefaultConnection=Server=mssql,1433;Database=GemMarketplaceDb;User Id=sa;Password=Your_password123;TrustServerCertificate=True;
    depends_on:
      - mssql

  frontend-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:5000/api"
    ports:
      - "3000:80"
    depends_on:
      - backend-api
