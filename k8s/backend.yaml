apiVersion: apps/v1
kind: Deployment
metadata:
  name: gem-backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gem-backend
  template:
    metadata:
      labels:
        app: gem-backend
    spec:
      containers:
      - name: gem-backend
        image: your-dockerhub-username/gem-backend:latest # Replace with your image
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: gem-backend-service
spec:
  selector:
    app: gem-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
